en:
  voices: [Samantha, Daniel, Karen, Moira]
  sentences:
    - "Hi, I'd like to book a consultation about my divorce."
    - "My employer dismissed me without any written warning."
    - "The landlord hasn't returned my security deposit."
    - "I received a notice to quit on Friday."
    - "Is there a deadline for filing an unfair dismissal claim?"
    - "We need advice on child custody arrangements."
    - "My tenancy agreement says the rent can't go up until next year."
    - "I was served with court papers this morning."
    - "Can a lawyer call me back this afternoon?"
    - "The hearing is scheduled for the fourteenth of October."
    - "I think my redundancy was discriminatory."
    - "My ex-partner stopped paying child maintenance."
    - "The flat has had damp and mould for six months."
    - "They offered me a settlement agreement and I don't know if I should sign it."
    - "My name is Oluwaseun Adeyemi, that's O L U W A S E U N."
    - "I'm calling on behalf of my elderly mother."
    - "The eviction notice gives us two weeks."
    - "Do you handle prenuptial agreements?"
    - "My manager has been bullying me for over a year."
    - "I'd prefer an appointment on Thursday morning."
    - "The letting agent is withholding part of the deposit for cleaning."
    - "My contract has a non-compete clause for twelve months."
    - "We're separating and need to sort out the house."
    - "Is the first consultation free of charge?"
    - "I've been off sick and now they want to dismiss me."
    - "The court date is next Wednesday."
    - "Could you send the confirmation to my work email?"
    - "My phone number is zero seven seven zero, nine double zero, one two three."
    - "I was told I have to leave the property by the end of the month."
    - "Thank you, that's everything for now."
de:
  voices: ["Anna", "Eddy (German (Germany))", "Flo (German (Germany))", "Sandy (German (Germany))"]
  sentences:
    - "Guten Tag, ich möchte einen Termin für eine Erstberatung vereinbaren."
    - "Ich habe eine fristlose Kündigung erhalten."
    - "Mein Arbeitgeber hat mir eine Abmahnung geschickt."
    - "Wie lange habe ich Zeit für eine Kündigungsschutzklage?"
    - "Mir wurde ein Aufhebungsvertrag angeboten."
    - "Mein Vermieter hat Eigenbedarf angemeldet."
    - "Die Nebenkostenabrechnung ist viel zu hoch."
    - "Wir haben seit Monaten Schimmel in der Wohnung und möchten die Miete mindern."
    - "Der Vermieter gibt die Mietkaution nicht zurück."
    - "Ich habe eine Räumungsklage bekommen."
    - "Es geht um das Sorgerecht für unsere beiden Kinder."
    - "Mein Ex-Mann zahlt keinen Unterhalt mehr."
    - "Wir möchten uns scheiden lassen und brauchen Beratung zum Zugewinnausgleich."
    - "Ich habe einen Mahnbescheid im Briefkasten gefunden."
    - "Mein Arbeitszeugnis ist schlechter als meine Leistung."
    - "Die Frist endet am fünfzehnten Oktober."
    - "Der Gerichtstermin ist nächste Woche Mittwoch."
    - "Können Sie mich heute Nachmittag zurückrufen?"
    - "Ich bin seit drei Jahren in der Firma und jetzt wurde mir betriebsbedingt gekündigt."
    - "Mein Chef hat mir die Überstunden nicht bezahlt."
    - "Ist die Erstberatung kostenlos?"
    - "Übernimmt meine Rechtsschutzversicherung die Kosten?"
    - "Ich rufe im Auftrag meiner Mutter an."
    - "Die Mieterhöhung ist schon die zweite in diesem Jahr."
    - "Ich wurde während der Elternzeit gekündigt."
    - "Der Betriebsrat wurde vor der Kündigung nicht angehört."
    - "Wir streiten uns über das Umgangsrecht."
    - "Der Vermieter will die Wohnung sanieren und wir sollen ausziehen."
    - "Ich brauche Hilfe bei einem Arbeitsunfall."
    - "Mein Name ist Dorothea Schwarzenberger-Lindqvist."
    - "Meine Telefonnummer ist null eins sieben sechs, zwei drei vier, fünf sechs sieben."
    - "Donnerstag um neun Uhr wäre ideal."
    - "Die Kündigungsfrist beträgt laut Vertrag drei Monate zum Quartalsende."
    - "Ich habe gegen die Befristung meines Arbeitsvertrags Bedenken."
    - "Es geht um eine Staffelmiete und eine Indexmiete."
    - "Ich habe die Wohnung ordnungsgemäß übergeben."
    - "Mein Arbeitgeber verweigert mir den Resturlaub."
    - "Wir haben einen Ehevertrag, aber ich weiß nicht, ob der wirksam ist."
    - "Das Jugendamt hat sich bei uns gemeldet."
    - "Ich wurde gemobbt und bin jetzt krankgeschrieben."
    - "Der Hausverwalter reagiert seit Wochen nicht."
    - "Mir wurde eine Vertragsstrafe angedroht."
    - "Wie hoch ist die Abfindung normalerweise?"
    - "Ich möchte die Scheidung einreichen."
    - "Es gibt Streit um das Erbe meines Vaters."
    - "Die Heizung ist seit November kaputt."
    - "Ich habe eine Kündigung wegen Zahlungsverzug erhalten."
    - "Können Sie mir die Bestätigung per E-Mail schicken?"
    - "Ich bin Grenzgänger und arbeite in der Schweiz."
    - "Vielen Dank, das war alles."
