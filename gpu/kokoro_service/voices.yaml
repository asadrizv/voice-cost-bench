# Qwen3-TTS VoiceDesign voices this service serves, addressed as `qwen3-tts:<id>`.
# A voice is a description, not a recording: nobody's voice is cloned and no speaker
# consent is involved. `language` must be one of the model's codec languages
# (config.json: talker_config.codec_language_id), not an ISO code.
version: 1

voices:
  clara_de:
    language: german
    description: >-
      A warm, professional German woman in her thirties working as a law firm
      receptionist. Neutral High German with no regional accent, clear articulation,
      calm and unhurried, friendly but businesslike.
