# Qwen3-TTS VoiceDesign voices this service serves, addressed as `qwen3-tts:<id>`. A voice
# is a description, not a cloned recording, so no speaker consent is involved.
version: 1

# `language` is one of the model's codec languages (config.json:
# talker_config.codec_language_id), not an ISO code.

voices:
  clara_de:
    language: german
    description: >-
      A warm, professional German woman in her thirties working as a law firm
      receptionist. Neutral High German with no regional accent, clear articulation,
      calm and unhurried, friendly but businesslike.
